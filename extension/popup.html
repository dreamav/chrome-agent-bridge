<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Agent Bridge</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --cyan-neon: #38bdf8;
      --indigo-neon: #818cf8;
      --green-online: #10b981;
      --red-offline: #ef4444;
      --btn-grad: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      --btn-hover: linear-gradient(135deg, #0369a1 0%, #4338ca 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html {
      width: 360px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 140px),
        radial-gradient(circle at 0% 100%, rgba(129, 140, 248, 0.12) 0%, transparent 120px),
        var(--bg);
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    h1 {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }


    /* Segmented Nav Tabs */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      gap: 3px;
    }

    .nav-tab {
      flex: 1;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
    }

    .nav-tab:hover {
      color: #fff;
    }

    .nav-tab.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .count-pill {
      font-size: 9.5px;
      padding: 1px 6px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-weight: 700;
    }

    /* Panels */
    .tab-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tab-view.hidden {
      display: none;
    }

    /* Metric Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .metric-value span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Buttons */
    .btn {
      width: 100%;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--btn-grad);
      color: #fff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-primary:hover {
      background: var(--btn-hover);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .btn-ai {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }

    .btn-ai:hover {
      background: linear-gradient(135deg, #6d28d9 0%, #1d4ed8 100%);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);
    }

    /* Session Form Block */
    .session-form {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .session-input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 11.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .session-input:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
    }

    .session-form-btns {
      display: flex;
      gap: 6px;
    }

    .session-form-btns .btn {
      flex: 1;
    }

    /* Sessions List Container */
    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .sessions-list::-webkit-scrollbar {
      width: 4px;
    }
    .sessions-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
    }
    .sessions-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .sessions-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Session Card */
    .session-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .session-card:hover {
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(24, 32, 50, 0.85);
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .session-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .session-date {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .session-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge-pill {
      font-size: 9.5px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Group Chips */
    .session-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 1px;
    }

    .group-chip {
      font-size: 9.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .group-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .group-chip:active {
      transform: scale(0.96);
    }

    .group-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Session Action Buttons */
    .session-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .btn-mini {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      padding: 5px 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-mini:active {
      transform: scale(0.97);
    }

    .btn-mini-primary {
      background: var(--btn-grad);
      color: #fff;
      flex: 1;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
    }

    .btn-mini-primary:hover {
      background: var(--btn-hover);
    }

    .btn-mini-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-mini-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .btn-mini-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 5px 7px;
    }

    .btn-mini-danger:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #fff;
    }

    /* Empty state */
    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      border: 1px dashed var(--card-border);
    }

    .empty-icon {
      font-size: 24px;
      opacity: 0.7;
    }

    /* Toast notification */
    .toast {
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 8px;
      text-align: center;
      display: none;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #bae6fd;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-manager {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(129, 140, 248, 0.15) 100%);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.15);
      font-weight: 600;
      padding: 8px 12px;
      font-size: 11.5px;
    }

    .btn-manager:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25) 0%, rgba(129, 140, 248, 0.25) 100%);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="title-group">
        <img src="icons/icon48.png" alt="Bridge Logo" class="logo-icon" />
        <h1>Chrome Bridge</h1>
      </div>
    </div>

    <!-- Prominent Fullscreen Dashboard Button -->
    <button id="btnOpenManager" class="btn btn-manager" type="button" title="Открыть полноэкранный менеджер во вкладке">
      🖥️ Открыть менеджер во весь экран →
    </button>

    <!-- Segmented Navigation -->
    <div class="nav-tabs">
      <button id="tabNavActions" class="nav-tab active" type="button">
        ⚡ Действия
      </button>
      <button id="tabNavSessions" class="nav-tab" type="button">
        💾 Сессии <span id="sessionsCountBadge" class="count-pill">0</span>
      </button>
    </div>

    <!-- Notification Toast -->
    <div id="toastMessage" class="toast"></div>

    <!-- VIEW 1: ACTIONS -->
    <div id="viewActions" class="tab-view">
      <!-- Metric Card -->
      <div class="card">
        <div class="metric-row">
          <span class="metric-label">Открытых вкладок:</span>
          <div class="metric-value">
            <span id="tabCount">0</span>
            <span>вкладок</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <button id="btnRefresh" class="btn btn-primary" type="button">
        Обновить список вкладок →
      </button>

      <button id="btnDedupe" class="btn btn-secondary" type="button">
        Закрыть дубликаты →
      </button>

      <button id="btnUngroup" class="btn btn-secondary" type="button">
        Распустить группы →
      </button>
    </div>

    <!-- VIEW 2: SESSIONS -->
    <div id="viewSessions" class="tab-view hidden">
      <!-- Save Session Form -->
      <div class="card session-form">
        <input
          id="sessionNameInput"
          class="session-input"
          type="text"
          placeholder="Сессия ГГГГ-ММ-ДД ЧЧ:ММ"
        />
        <div class="session-form-btns">
          <button id="btnSaveSession" class="btn btn-primary" type="button">
            💾 Сохранить с группами
          </button>
          <button id="btnImportSession" class="btn btn-secondary" type="button">
            📤 Импорт JSON
          </button>
          <input type="file" id="fileImportInput" accept=".json" style="display: none;" />
        </div>
      </div>

      <!-- Saved Sessions List -->
      <div id="sessionsList" class="sessions-list">
        <!-- Rendered dynamically by popup.js -->
      </div>
    </div>

  </div>

  <script src="popup/ui-helpers.js"></script>
  <script src="popup/actions-controller.js"></script>
  <script src="popup/sessions-controller.js"></script>
  <script src="popup.js"></script>
</body>
</html>
